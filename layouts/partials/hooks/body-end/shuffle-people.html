{{/* Shuffle People cards into a random order on every page load (People page only). */}}
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".people-widget").forEach(function (grid) {
    var cards = Array.prototype.slice.call(grid.querySelectorAll(":scope > .people-person"));
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
    }
    cards.forEach(function (c) { grid.appendChild(c); });
  });
});
</script>
